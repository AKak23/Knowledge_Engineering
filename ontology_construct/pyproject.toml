[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "ontology-construct"
version = "0.1.0"
description = "Long-text ontology construction pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1.7",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.2.0",
  "pydantic>=2.7.1",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0.1",
  "rich>=13.7.1",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
ontology-construct = "ontology_construct.cli:cli"
ontology-construct-api = "ontology_construct.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ontology_construct"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
